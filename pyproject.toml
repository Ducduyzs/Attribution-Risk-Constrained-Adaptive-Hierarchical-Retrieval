[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edahr-neural"
version = "0.1.0"
description = "Attribution-risk-aware adaptive hierarchical retrieval for verifiable scientific document QA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "torch>=2.4", "transformers>=4.51",
  "FlagEmbedding>=1.3.5", "faiss-cpu>=1.10", "docling>=2.48",
  "pydantic>=2.9", "pydantic-settings>=2.5", "fastapi>=0.115",
  "uvicorn[standard]>=0.34", "google-genai>=1.30", "openai>=1.40",
  "orjson>=3.10", "scikit-learn>=1.7", "joblib>=1.4"
]

[project.optional-dependencies]
gpu = ["accelerate>=1.3", "bitsandbytes>=0.45"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
edahr = "edahr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

